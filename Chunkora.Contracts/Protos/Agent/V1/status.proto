syntax = "proto3";

package chunkora.agent.v1;

option csharp_namespace = "Chunkora.Contracts.Agent.V1";

service StatusService {
  rpc NotifyOverview (Overview) returns (OverviewResponse);
}

message Overview {
  string request_id = 1;
  uint32 version = 2;
  string architecture = 3;
  string os_type = 4;
  string hostname = 5;
  string os_detail = 6;
  double cpu_usage = 7;
  uint64 memory_used_bytes = 8;
  uint64 memory_total_bytes = 9;
}

message OverviewResponse {
  string request_id = 1;
}
