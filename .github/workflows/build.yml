name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [Agent, Server]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        id: sdk
        with:
          dotnet-version: 10.0.x

      - name: Publish linux-x64
        if: &can_publish ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        uses: ./.github/actions/publish-dotnet
        with:
          project: ${{ matrix.project }}
          rid: linux-x64

      - name: Publish linux-arm64
        if: *can_publish
        uses: ./.github/actions/publish-dotnet
        with:
          project: ${{ matrix.project }}
          rid: linux-arm64

      - name: Publish win-x64
        if: *can_publish
        uses: ./.github/actions/publish-dotnet
        with:
          project: ${{ matrix.project }}
          rid: win-x64

      - name: Publish win-arm64
        if: *can_publish
        uses: ./.github/actions/publish-dotnet
        with:
          project: ${{ matrix.project }}
          rid: win-arm64

      - name: Publish osx-x64
        if: *can_publish
        uses: ./.github/actions/publish-dotnet
        with:
          project: ${{ matrix.project }}
          rid: osx-x64

      - name: Publish osx-arm64
        if: *can_publish
        uses: ./.github/actions/publish-dotnet
        with:
          project: ${{ matrix.project }}
          rid: osx-arm64

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Chunkora.Web
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Chunkora.Web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: Chunkora.Web
          path: Chunkora.Web/dist/
          if-no-files-found: error
