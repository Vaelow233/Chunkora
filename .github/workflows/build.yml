name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.project }} (${{ matrix.rid }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [Agent, Server]
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]
    env:
      PACKAGE_NAME: Chunkora.${{ matrix.project }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >-
          dotnet publish Chunkora.${{ matrix.project }}/Chunkora.${{ matrix.project }}.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      - name: Package for Windows
        if: startsWith(matrix.rid, 'win-')
        working-directory: publish
        run: zip -qr "../$PACKAGE_NAME.zip" .

      - name: Package for Linux and macOS
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: tar -czf "$PACKAGE_NAME.tar.gz" -C publish .

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE_NAME }}.*
          archive: false
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Chunkora.Web
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Chunkora.Web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: Chunkora.Web
          path: Chunkora.Web/dist/
          if-no-files-found: error
