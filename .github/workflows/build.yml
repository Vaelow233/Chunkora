name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.project }} (${{ matrix.target.rid }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        project: [Agent, Server]
        target:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: win-x64, runner: windows-2025 }
          - { rid: win-arm64, runner: windows-2025 }
          - { rid: osx-x64, runner: macos-15-intel }
          - { rid: osx-arm64, runner: macos-15 }
    env:
      PACKAGE_NAME: Chunkora.${{ matrix.project }}-${{ matrix.target.rid }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux' && matrix.project == 'Agent'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: >-
          dotnet publish Chunkora.${{ matrix.project }}/Chunkora.${{ matrix.project }}.csproj
          -c Release -r ${{ matrix.target.rid }} --self-contained true -o publish

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: tar -a -cf "$env:PACKAGE_NAME.zip" -C publish .

      - name: Package for Linux and macOS
        if: runner.os != 'Windows'
        run: tar -czf "$PACKAGE_NAME.tar.gz" -C publish .

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE_NAME }}.*
          archive: false
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Chunkora.Web
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Chunkora.Web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: Chunkora.Web
          path: Chunkora.Web/dist/
          if-no-files-found: error
